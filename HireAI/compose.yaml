
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hireai-sqlserver
    env_file:
      - ./database/sqlserver.env
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/var/opt/mssql/backup:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: hireai-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "5001:5001"
    depends_on:
      - sqlserver
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5001
    container_name: hireai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  sqlserver_data: